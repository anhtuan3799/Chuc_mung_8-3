<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:black;
}

/* nền blur */

body::before{
content:"";
position:fixed;
inset:0;
background:url("anh.jpg") center/contain no-repeat;
filter:blur(40px);
transform:scale(1.3);
z-index:-2;
}

body::after{
content:"";
position:fixed;
inset:0;
background:url("girl.jpg") center/contain no-repeat;
z-index:-1;
}

/* phong bì */

.envelope{
position:relative;
width:320px;
height:200px;
cursor:pointer;
z-index:5;
}

.flap{
position:absolute;
width:100%;
height:100%;
background:#ff8fa3;
clip-path:polygon(0 0,100% 0,50% 60%);
transition:0.6s;
z-index:2;
}

.body{
position:absolute;
width:100%;
height:100%;
background:#ffccd5;
border-radius:8px;
}

.letter{
position:absolute;
top:20px;
left:10px;
right:10px;
bottom:10px;
background:white;
border-radius:8px;
padding:20px;
text-align:center;
font-size:14px;
line-height:1.6;
transform:translateY(100px);
transition:0.6s;
opacity:0;
}

.open .flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(0);
opacity:1;
}

/* hoa */

.sakura{
position:absolute;
font-size:18px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

/* tim */

.heart{
position:absolute;
font-size:18px;
color:red;
animation:fly 2s linear forwards;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-200px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">

<div class="flap"></div>

<div class="body"></div>

<div class="letter">

<h3>💌 Gửi bạn</h3>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em vẫn luôn mạnh mẽ  
và thành công ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

</div>

<script>

/* mở thư */

function openLetter(){
document.querySelector(".envelope").classList.toggle("open")
}

/* hoa rơi */

function createFlower(){

const flower=document.createElement("div")

flower.className="sakura"
flower.innerHTML="🌸"

flower.style.left=Math.random()*100+"vw"
flower.style.animationDuration=(5+Math.random()*5)+"s"

document.body.appendChild(flower)

setTimeout(()=>{
flower.remove()
},10000)

}

setInterval(createFlower,300)

/* tim bay */

document.addEventListener("click",(e)=>{

const heart=document.createElement("div")

heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=e.clientX+"px"
heart.style.top=e.clientY+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},2000)

})

</script>

</body>
</html>
