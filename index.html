<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Mừng 8/3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{

height:100vh;
background-image:url("anh.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;
color:white;
text-align:center;

}

/* LỚP LÀM ẢNH TỐI NHẸ */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-1;
}

/* ENVELOPE */

.envelope{

background:rgba(255,255,255,0.15);
backdrop-filter:blur(8px);

padding:30px;
border-radius:20px;

max-width:340px;

box-shadow:0 10px 40px rgba(0,0,0,0.5);

cursor:pointer;

transition:0.4s;

}

.envelope:hover{
transform:scale(1.05);
}

h1{
margin-bottom:10px;
font-size:28px;
}

.letter{

display:none;

margin-top:15px;

font-size:18px;
line-height:1.6;

}

/* STAR */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%{opacity:0.3}
50%{opacity:1}
100%{opacity:0.3}
}

/* ROSE */

.rose{
position:absolute;
top:-10px;
font-size:26px;
animation:fall linear infinite;
filter:drop-shadow(0 0 10px pink);
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}

/* HEART */

.heart{

position:absolute;
color:#ff4d6d;

font-size:18px;

animation:float 6s linear infinite;

filter:drop-shadow(0 0 10px red);

}

@keyframes float{

from{
transform:translateY(100vh) scale(0.8);
opacity:1;
}

to{
transform:translateY(-10vh) scale(1.4);
opacity:0;
}

}

/* MOBILE */

@media(max-width:500px){

h1{
font-size:22px;
}

}

</style>
</head>

<body>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_36a4e9c0b2.mp3">
</audio>

<div class="envelope" onclick="openLetter()">

<h1>💌 Gửi bạn</h1>
<p>(Nhấn để mở thư)</p>

<div class="letter" id="letter">

🌸 Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

ở xứ người mong em vẫn luôn mạnh mẽ và thành công.✨

Chúc em luôn mỉm cười mỗi ngày 💖

</div>

</div>

<script>

/* OPEN LETTER */

function openLetter(){
document.getElementById("letter").style.display="block"
}

/* STARS */

for(let i=0;i<80;i++){

let star=document.createElement("div")

star.className="star"

star.style.left=Math.random()*100+"vw"
star.style.top=Math.random()*100+"vh"

star.style.animationDelay=Math.random()*3+"s"

document.body.appendChild(star)

}

/* ROSES */

function createRose(){

let rose=document.createElement("div")

rose.className="rose"

rose.innerHTML="🌸"

rose.style.left=Math.random()*100+"vw"

rose.style.animationDuration=5+Math.random()*5+"s"

document.body.appendChild(rose)

setTimeout(()=>rose.remove(),9000)

}

setInterval(createRose,400)

/* HEART */

function createHeart(){

let heart=document.createElement("div")

heart.className="heart"

heart.innerHTML="❤"

heart.style.left=Math.random()*100+"vw"

heart.style.animationDuration=4+Math.random()*3+"s"

document.body.appendChild(heart)

setTimeout(()=>heart.remove(),7000)

}

setInterval(createHeart,800)

</script>

</body>
</html>
