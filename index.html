<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

/* ẢNH NỀN */

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:url("anh.jpg") center/cover no-repeat;

}

/* lớp tối nhẹ */

body::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
}

/* PHONG BÌ */

.envelope{

position:relative;
width:460px;
height:280px;

cursor:pointer;
z-index:5;

animation:float 3s ease-in-out infinite;

}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-12px)}
}

.envelope-body{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ff9bb3,#ff4d6d);
border-radius:18px;

box-shadow:0 20px 50px rgba(0,0,0,0.4);

}

/* NẮP PHONG BÌ */

.envelope-flap{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ffb3c6,#ff758f);

clip-path:polygon(0 0,100% 0,50% 65%);

transition:0.8s;
transform-origin:top;

border-radius:18px;

}

/* LÁ THƯ */

.letter{

position:absolute;

left:30px;
right:30px;
top:30px;
bottom:30px;

background:white;

border-radius:14px;

padding:30px;

text-align:center;
line-height:1.7;

transform:translateY(140px);
opacity:0;

transition:0.8s;

}

/* mở thư */

.open .envelope-flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(0);
opacity:1;
}

h2{
margin-bottom:12px;
font-size:24px;
}

/* HOA */

.flower{
position:absolute;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{

0%{
transform:translateY(-10px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}

}

/* TIM */

.heart{
position:absolute;
font-size:22px;
animation:fly 2s linear forwards;
}

@keyframes fly{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-230px);
opacity:0;
}

}

</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">

<div class="envelope-body"></div>

<div class="envelope-flap"></div>

<div class="letter">

<h2>💌 Gửi bạn</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em luôn mạnh mẽ  
và đạt được những điều em mong muốn ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

</div>

<script>

function openLetter(){
document.querySelector(".envelope").classList.toggle("open")
}

/* hoa rơi */

function flower(){

let f=document.createElement("div")

f.className="flower"
f.innerHTML="🌸"

f.style.left=Math.random()*100+"vw"
f.style.animationDuration=(6+Math.random()*6)+"s"

document.body.appendChild(f)

setTimeout(()=>{f.remove()},12000)

}

setInterval(flower,400)

/* tim bay */

document.addEventListener("click",e=>{

let h=document.createElement("div")

h.className="heart"
h.innerHTML="❤️"

h.style.left=e.clientX+"px"
h.style.top=e.clientY+"px"

document.body.appendChild(h)

setTimeout(()=>{h.remove()},2000)

})

</script>

</body>
</html>
