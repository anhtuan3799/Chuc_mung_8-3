<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

/* ảnh nền */

background-image:url("anh.jpg");
background-size:cover;
background-position:center;
}

/* lớp tối nhẹ để nổi chữ */

body::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.35);
}

/* phong bì */

.envelope{
position:relative;
width:360px;
height:230px;
cursor:pointer;
z-index:5;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.envelope-body{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff7aa2,#ff4d6d);
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.envelope-flap{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff8fab,#ff758f);
clip-path:polygon(0 0,100% 0,50% 60%);
transition:0.7s;
transform-origin:top;
}

.letter{
position:absolute;
left:20px;
right:20px;
top:20px;
bottom:20px;

background:white;
border-radius:10px;

padding:25px;

text-align:center;
line-height:1.6;

transform:translateY(120px);
opacity:0;
transition:0.7s;
}

/* mở thư */

.open .envelope-flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(0);
opacity:1;
}

h2{
margin-bottom:10px;
}

/* hoa */

.flower{
position:absolute;
font-size:18px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

/* tim */

.heart{
position:absolute;
font-size:20px;
animation:fly 2s linear forwards;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-220px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">

<div class="envelope-body"></div>

<div class="envelope-flap"></div>

<div class="letter">

<h2>💌 Gửi bạn</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em luôn mạnh mẽ  
và đạt được những điều em mong muốn ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

</div>

<script>

function openLetter(){
document.querySelector(".envelope").classList.toggle("open")
}

/* hoa rơi */

function flower(){

let f=document.createElement("div")

f.className="flower"
f.innerHTML="🌸"

f.style.left=Math.random()*100+"vw"
f.style.animationDuration=(5+Math.random()*5)+"s"

document.body.appendChild(f)

setTimeout(()=>{f.remove()},10000)

}

setInterval(flower,300)

/* tim bay */

document.addEventListener("click",e=>{

let h=document.createElement("div")

h.className="heart"
h.innerHTML="❤️"

h.style.left=e.clientX+"px"
h.style.top=e.clientY+"px"

document.body.appendChild(h)

setTimeout(()=>{h.remove()},2000)

})

</script>

</body>
</html>
