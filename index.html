<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Women's Day</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:url("anh.jpg") center/cover no-repeat;

}

/* lớp blur nhẹ */

body::after{

content:"";
position:absolute;
inset:0;

background:rgba(0,0,0,0.2);

backdrop-filter:blur(4px);

}

/* chữ 8/3 */

.title{

position:absolute;
top:7%;

font-size:55px;
font-weight:bold;

color:white;

text-shadow:
0 0 10px pink,
0 0 30px #ff4d6d;

animation:float 4s ease-in-out infinite;

z-index:10;

}

@keyframes float{

0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}

}

/* glass card */

.card{

width:420px;

padding:35px;

border-radius:20px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.3);

box-shadow:0 20px 60px rgba(0,0,0,0.4);

text-align:center;

color:white;

z-index:20;

animation:fadeUp 1.2s ease;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.card h2{

margin-bottom:15px;
font-size:26px;

}

.card p{

line-height:1.8;
font-size:17px;

}

/* hoa hồng */

.rose{

position:absolute;
font-size:24px;

animation:fall linear infinite,
spin 4s linear infinite;

filter:drop-shadow(0 0 8px #ff4d6d);

}

@keyframes fall{

0%{
transform:translateY(-40px);
opacity:1;
}

100%{
transform:translateY(110vh);
opacity:0;
}

}

@keyframes spin{

0%{transform:rotate(0)}
100%{transform:rotate(360deg)}

}

/* bướm */

.butterfly{

position:absolute;
font-size:20px;

animation:fly 12s linear infinite;

filter:drop-shadow(0 0 10px pink);

}

@keyframes fly{

0%{transform:translateX(-10vw)}
100%{transform:translateX(110vw)}

}

/* bụi vàng */

.sparkle{

position:absolute;

width:4px;
height:4px;

background:gold;

border-radius:50%;

box-shadow:0 0 8px gold;

animation:twinkle 2s infinite;

}

@keyframes twinkle{

0%{opacity:0}
50%{opacity:1}
100%{opacity:0}

}

/* mobile */

@media(max-width:600px){

.card{

width:85%;
padding:25px;

}

.title{
font-size:38px;
}

}

</style>
</head>

<body>

<div class="title">✨ 8 / 3 ✨</div>

<div class="card">

<h2>💌 Gửi bạn</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em luôn mạnh mẽ  
và đạt được những điều em mong muốn ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

<audio id="music" src="music.mp3"></audio>

<script>

/* nhạc khi click */

document.body.addEventListener("click",()=>{
document.getElementById("music").play()
},{once:true})

/* hoa */

function rose(){

let r=document.createElement("div")

r.className="rose"
r.innerHTML="🌹"

r.style.left=Math.random()*100+"vw"
r.style.animationDuration=(6+Math.random()*6)+"s"

document.body.appendChild(r)

setTimeout(()=>{r.remove()},12000)

}

setInterval(rose,500)

/* bướm */

function butterfly(){

let b=document.createElement("div")

b.className="butterfly"
b.innerHTML="🦋"

b.style.top=Math.random()*70+"vh"

document.body.appendChild(b)

setTimeout(()=>{b.remove()},12000)

}

setInterval(butterfly,5000)

/* bụi vàng */

function sparkle(){

let s=document.createElement("div")

s.className="sparkle"

s.style.left=Math.random()*100+"vw"
s.style.top=Math.random()*100+"vh"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},2000)

}

setInterval(sparkle,120)

</script>

</body>
</html>
