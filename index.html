<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Women's Day</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

/* BACKGROUND ẢNH CÔ ẤY */

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:url("anh.jpg") center/cover no-repeat;

}

/* lớp ánh sáng mộng mơ */

body::after{

content:"";
position:absolute;
inset:0;

background:linear-gradient(
to top,
rgba(0,0,0,0.4),
rgba(255,150,200,0.25)
);

}

/* chữ 8/3 phát sáng */

.glow-text{

position:absolute;
top:8%;
font-size:70px;
font-weight:bold;

color:#fff;

text-shadow:
0 0 10px pink,
0 0 20px pink,
0 0 40px #ff5fa2,
0 0 80px #ff5fa2;

z-index:5;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}

}

/* phong bì */

.envelope{

position:relative;
width:460px;
height:280px;

cursor:pointer;

z-index:10;

animation:float2 3s ease-in-out infinite;

}

@keyframes float2{

0%,100%{transform:translateY(0)}
50%{transform:translateY(-14px)}

}

.envelope-body{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ff9bb3,#ff4d6d);

border-radius:18px;

box-shadow:0 25px 60px rgba(0,0,0,0.45);

}

/* nắp */

.envelope-flap{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ffb3c6,#ff758f);

clip-path:polygon(0 0,100% 0,50% 65%);

transition:0.8s;
transform-origin:top;

border-radius:18px;

}

/* lá thư */

.letter{

position:absolute;

left:30px;
right:30px;
top:30px;
bottom:30px;

background:white;

border-radius:14px;

padding:30px;

text-align:center;
line-height:1.7;

transform:translateY(140px);
opacity:0;

transition:0.8s;

}

.open .envelope-flap{
transform:rotateX(180deg);
}

.open .letter{
transform:translateY(0);
opacity:1;
}

h2{
margin-bottom:12px;
font-size:24px;
}

/* hoa */

.rose{

position:absolute;
font-size:22px;

animation:fall linear infinite;

}

@keyframes fall{

0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}

}

/* bướm */

.butterfly{

position:absolute;
font-size:22px;

animation:flyButter 8s linear infinite;

}

@keyframes flyButter{

0%{transform:translateX(-10vw) translateY(0)}
50%{transform:translateX(50vw) translateY(-40px)}
100%{transform:translateX(110vw) translateY(0)}

}

/* bụi vàng */

.sparkle{

position:absolute;
width:4px;
height:4px;
background:gold;

border-radius:50%;

box-shadow:0 0 8px gold;

animation:twinkle 2s infinite;

}

@keyframes twinkle{

0%{opacity:0}
50%{opacity:1}
100%{opacity:0}

}

</style>
</head>

<body>

<div class="glow-text">✨ 8 / 3 ✨</div>

<div class="envelope" onclick="openLetter()">

<div class="envelope-body"></div>

<div class="envelope-flap"></div>

<div class="letter">

<h2>💌 Gửi bạn</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em luôn mạnh mẽ  
và đạt được những điều em mong muốn ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

</div>

<script>

function openLetter(){
document.querySelector(".envelope").classList.toggle("open")
}

/* hoa hồng */

function rose(){

let r=document.createElement("div")

r.className="rose"
r.innerHTML="🌹"

r.style.left=Math.random()*100+"vw"
r.style.animationDuration=(6+Math.random()*6)+"s"

document.body.appendChild(r)

setTimeout(()=>{r.remove()},12000)

}

setInterval(rose,500)

/* bướm */

function butterfly(){

let b=document.createElement("div")

b.className="butterfly"
b.innerHTML="🦋"

b.style.top=Math.random()*60+"vh"

document.body.appendChild(b)

setTimeout(()=>{b.remove()},8000)

}

setInterval(butterfly,4000)

/* bụi vàng */

function sparkle(){

let s=document.createElement("div")

s.className="sparkle"

s.style.left=Math.random()*100+"vw"
s.style.top=Math.random()*100+"vh"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},2000)

}

setInterval(sparkle,120)

</script>

</body>
</html>
