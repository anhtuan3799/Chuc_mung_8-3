<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Women's Day</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

background:url("anh.jpg") center/cover no-repeat;

}

/* nền mờ để thấy ảnh */

body::after{

content:"";
position:absolute;
inset:0;

background:rgba(0,0,0,0.25);

backdrop-filter:blur(3px);

}

/* chữ 8/3 */

.glow-text{

position:absolute;
top:6%;

font-size:60px;
font-weight:bold;
color:white;

text-shadow:
0 0 10px pink,
0 0 20px pink,
0 0 40px #ff4d6d;

animation:float 4s ease-in-out infinite;

z-index:10;

}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-12px)}
}

/* phong bì */

.envelope{

position:relative;
width:420px;
height:260px;

cursor:pointer;

z-index:20;

perspective:1000px;

}

/* cinematic hover */

.envelope:hover{
transform:scale(1.05);
transition:0.4s;
}

.envelope-body{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ff9bb3,#ff4d6d);

border-radius:18px;

box-shadow:0 20px 60px rgba(0,0,0,0.45);

}

/* nắp phong bì */

.envelope-flap{

position:absolute;
width:100%;
height:100%;

background:linear-gradient(135deg,#ffb3c6,#ff758f);

clip-path:polygon(0 0,100% 0,50% 65%);

transform-origin:top;

transition:1s;

border-radius:18px;

}

/* thư */

.letter{

position:absolute;

left:25px;
right:25px;
top:25px;
bottom:25px;

background:white;

border-radius:14px;

padding:30px;

text-align:center;
line-height:1.7;

transform:translateY(120px);

opacity:0;

transition:1s;

box-shadow:0 10px 30px rgba(0,0,0,0.3);

}

.open .envelope-flap{
transform:rotateX(180deg);
}

.open .letter{

transform:translateY(0);

opacity:1;

}

/* text */

h2{
margin-bottom:12px;
}

/* hoa hồng 3D */

.rose{

position:absolute;
font-size:26px;

animation:roseFall linear infinite,
roseSpin 4s linear infinite;

filter:drop-shadow(0 0 10px #ff4d6d);

}

@keyframes roseFall{

0%{
transform:translateY(-50px) rotateY(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotateY(720deg);
opacity:0;
}

}

@keyframes roseSpin{

0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

/* bướm */

.butterfly{

position:absolute;
font-size:22px;

animation:flyButter 12s linear infinite;

filter:drop-shadow(0 0 10px pink);

}

@keyframes flyButter{

0%{transform:translateX(-10vw)}
100%{transform:translateX(110vw)}

}

/* bụi vàng */

.sparkle{

position:absolute;

width:4px;
height:4px;

background:gold;

border-radius:50%;

box-shadow:0 0 8px gold;

animation:twinkle 2s infinite;

}

@keyframes twinkle{

0%{opacity:0}
50%{opacity:1}
100%{opacity:0}

}

/* mobile */

@media(max-width:600px){

.envelope{

width:300px;
height:190px;

}

.glow-text{
font-size:40px;
}

}

</style>
</head>

<body>

<div class="glow-text">✨ 8 / 3 ✨</div>

<div class="envelope" onclick="openLetter()">

<div class="envelope-body"></div>
<div class="envelope-flap"></div>

<div class="letter">

<h2>💌 Gửi bạn</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp, rạng rỡ và hạnh phúc.

Ở xứ người mong em luôn mạnh mẽ  
và đạt được những điều em mong muốn ✨

Chúc em luôn mỉm cười mỗi ngày ❤️

</p>

</div>

</div>

<audio id="music" src="music.mp3"></audio>

<script>

/* mở thư + nhạc */

function openLetter(){

document.querySelector(".envelope").classList.toggle("open")

document.getElementById("music").play()

}

/* hoa hồng */

function rose(){

let r=document.createElement("div")

r.className="rose"

r.innerHTML="🌹"

r.style.left=Math.random()*100+"vw"

r.style.animationDuration=(6+Math.random()*6)+"s"

document.body.appendChild(r)

setTimeout(()=>{r.remove()},12000)

}

setInterval(rose,500)

/* bướm */

function butterfly(){

let b=document.createElement("div")

b.className="butterfly"

b.innerHTML="🦋"

b.style.top=Math.random()*70+"vh"

document.body.appendChild(b)

setTimeout(()=>{b.remove()},12000)

}

setInterval(butterfly,5000)

/* bụi vàng */

function sparkle(){

let s=document.createElement("div")

s.className="sparkle"

s.style.left=Math.random()*100+"vw"
s.style.top=Math.random()*100+"vh"

document.body.appendChild(s)

setTimeout(()=>{s.remove()},2000)

}

setInterval(sparkle,120)

</script>

</body>
</html>
