<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 8/3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Segoe UI", sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background-image:url("anh.jpg"); /* đổi tên ảnh ở đây */
background-size:cover;
background-position:center 25%;
background-repeat:no-repeat;
}

/* lớp làm mờ nền */
body::before{
content:"";
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
}

/* hộp thư */
.card{
position:relative;
z-index:2;
width:320px;
padding:30px;
border-radius:20px;
text-align:center;
color:white;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.3);
cursor:pointer;
transition:0.4s;
}

.card:hover{
transform:scale(1.05);
}

.card h2{
margin-bottom:10px;
}

.card p{
line-height:1.6;
opacity:0;
max-height:0;
transition:0.6s;
}

/* mở thư */
.card.open p{
opacity:1;
max-height:500px;
margin-top:10px;
}

/* hoa rơi */

.sakura{
position:absolute;
top:-20px;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

/* tim */

.heart{
position:absolute;
color:red;
font-size:18px;
animation:fly 2s linear forwards;
}

@keyframes fly{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-200px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="card" onclick="openLetter()">
<h2>💌 Gửi bạn</h2>
<small>(Nhấn để mở thư)</small>

<p>
Chúc em một ngày 8/3 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và hạnh phúc.  
Ở xứ người mong em vẫn luôn mạnh mẽ và thành công ✨  
Chúc em luôn mỉm cười mỗi ngày ❤️
</p>

</div>

<script>

/* mở thư */

function openLetter(){
document.querySelector(".card").classList.toggle("open")
}

/* hoa rơi */

function createSakura(){

const flower=document.createElement("div")

flower.className="sakura"
flower.innerHTML="🌸"

flower.style.left=Math.random()*100+"vw"
flower.style.animationDuration=(5+Math.random()*5)+"s"

document.body.appendChild(flower)

setTimeout(()=>{
flower.remove()
},10000)

}

setInterval(createSakura,300)

/* tim bay */

document.addEventListener("click",function(e){

const heart=document.createElement("div")

heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=e.clientX+"px"
heart.style.top=e.clientY+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},2000)

})

</script>

</body>
</html>
