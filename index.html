<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Women's Day</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:url("anh.jpg") center/cover no-repeat;
}

/* lớp mờ để thấy ảnh */

body::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.25);
backdrop-filter:blur(3px);
}

/* tiêu đề */

.title{
position:absolute;
top:8%;
font-size:55px;
font-weight:bold;
color:white;
text-shadow:0 0 15px pink,0 0 40px #ff4d6d;
z-index:5;
}

/* nút mở thư */

.openBtn{

z-index:10;

padding:14px 30px;

font-size:18px;

border:none;

border-radius:40px;

background:#ff4d6d;

color:white;

cursor:pointer;

box-shadow:0 0 20px #ff4d6d;

transition:0.3s;

}

.openBtn:hover{
transform:scale(1.1);
}

/* card lời chúc */

.card{

position:absolute;

width:420px;

padding:35px;

border-radius:20px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.3);

box-shadow:0 20px 60px rgba(0,0,0,0.4);

text-align:center;

color:white;

display:none;

z-index:20;

animation:fadeUp 1s ease;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* tim + hoa */

.fall{

position:absolute;

font-size:24px;

animation:fall linear forwards;

}

@keyframes fall{

0%{
transform:translateY(-40px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}

}

/* mobile */

@media(max-width:600px){

.card{
width:85%;
}

.title{
font-size:36px;
}

}

</style>
</head>

<body>

<div class="title">✨ 8 / 3 ✨</div>

<button class="openBtn" onclick="openCard()">💌 Mở lời chúc</button>

<div class="card" id="card">

<h2>Chúc em 8/3 thật vui 🌸</h2>

<p>

Chúc em một ngày 8/3 thật nhiều niềm vui  
luôn xinh đẹp và hạnh phúc.

Dù đang ở nơi xa  
mong em luôn mạnh mẽ và đạt được điều em mong muốn.

Hy vọng mỗi ngày của em đều tràn ngập nụ cười ❤️

</p>

</div>

<audio id="music" src="music.mp3"></audio>

<script>

/* mở lời chúc */

function openCard(){

document.querySelector(".openBtn").style.display="none"

document.getElementById("card").style.display="block"

document.getElementById("music").play()

}

/* tim và hoa rơi */

function createFall(){

let el=document.createElement("div")

el.className="fall"

let icons=["❤️","🌸","💖"]

el.innerHTML=icons[Math.floor(Math.random()*icons.length)]

el.style.left=Math.random()*100+"vw"

el.style.animationDuration=(5+Math.random()*5)+"s"

document.body.appendChild(el)

setTimeout(()=>{
el.remove()
},10000)

}

/* xuất hiện ngay khi mở web */

setInterval(createFall,300)

</script>

</body>
</html>
